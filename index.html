<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pip-Boy Toolkit - Main Menu</title>
  <!-- Core Styles -->
  <link rel="stylesheet" href="core/css/main.css" />
  <style>
    .menu-list {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      padding: 2rem;
    }

    .menu-item {
      font-size: 1.5rem;
      text-decoration: none;
      color: var(--pip-green);
      border: 1px solid transparent;
      padding: 1rem;
      transition: all 0.2s;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .menu-item:hover {
      background: var(--pip-green);
      color: #000;
      box-shadow: 0 0 15px var(--pip-green);
    }

    .menu-item .tool-status {
      font-size: 0.9rem;
      opacity: 0.8;
    }

    .welcome-text {
      padding: 0 2rem;
      margin-bottom: 2rem;
    }

    /* Mobile Specifics (Portrait) */
    @media (max-width: 600px) {
      .menu-list {
        padding: 1rem;
        gap: 1rem;
      }

      .menu-item {
        font-size: 1.1rem;
        padding: 0.8rem;
      }

      .welcome-text {
        padding: 0 1rem;
        margin-bottom: 1rem;
      }

      .welcome-text h1 {
        font-size: 1.4rem;
      }

      .welcome-text p {
        font-size: 0.9rem;
      }
    }

    /* Landscape Refinements (Short height) */
    @media (max-height: 500px) {
      .menu-list {
        padding: 0.5rem 1rem;
        gap: 0.5rem;
      }

      .menu-item {
        font-size: 1.1rem;
        padding: 0.5rem 1rem;
      }

      .welcome-text {
        margin-bottom: 0.5rem;
      }

      .welcome-text h1 {
        font-size: 1.2rem;
      }
    }
  </style>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet" />
</head>

<body>
  <!-- Shared CRT Effects -->
  <div class="crt-overlay"></div>
  <div class="screen-curve"></div>

  <div class="pip-boy-container">
    <header class="pip-header">
      <span class="status-item active">MAIN MENU</span>
      <span class="status-item">TOOLS</span>
      <span class="status-item">SETTINGS</span>
      <span class="status-item">HELP</span>
    </header>

    <main class="pip-content" style="flex-direction: column; align-items: stretch; justify-content: flex-start;">
      <div class="welcome-text">
        <h1>ROBCO INDUSTRIES (TM) TERMLINK</h1>
        <p>WELCOME, USER. SELECT MODULE TO INITIALIZE.</p>
      </div>

      <div class="menu-list">
        <a href="tools/pomodoro/index.html" class="menu-item">
          <span>> POMODORO TIMER</span>
          <span class="tool-status">[ONLINE]</span>
        </a>

        <div class="menu-item" style="opacity: 0.4; cursor: not-allowed;">
          <span>> GEIGER COUNTER</span>
          <span class="tool-status">[OFFLINE - SENSOR REQ]</span>
        </div>

        <div class="menu-item" style="opacity: 0.4; cursor: not-allowed;">
          <span>> ENCRYPTION BREAKER</span>
          <span class="tool-status">[LOCKED]</span>
        </div>
      </div>
    </main>

    <footer class="pip-footer">
      <div class="function-description">
        v1.0.0-MODULAR | PIP-BOY 3000 TOOLKIT INTERFACE
      </div>
    </footer>
  </div>

  <!-- Core Logic -->
  <script src="core/js/main.js"></script>
</body>

</html>
