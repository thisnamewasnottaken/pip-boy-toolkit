<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pip-Boy Toolkit - Timer</title>
    <link rel="stylesheet" href="css/style.css" />
    <!-- Google Fonts: Share Tech Mono and Monofur equivalent -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="crt-overlay"></div>
    <div class="screen-curve"></div>

    <div class="pip-boy-container">
      <header class="pip-header">
        <span class="status-item">STAT</span>
        <span class="status-item">INV</span>
        <span class="status-item active">TIMER</span>
        <span class="status-item">MAP</span>
        <span class="status-item">RADIO</span>
      </header>

      <main class="pip-content">
        <div class="timer-display">
          <div class="mode-select">
            <button data-mode="work" class="mode-btn active">WORK</button>
            <button data-mode="short" class="mode-btn">SHORT</button>
            <button data-mode="long" class="mode-btn">LONG</button>
          </div>
          <h1 id="time-display">25:00</h1>
          <div class="status-indicator">
            STATUS: <span id="mode-text">STANDBY</span>
          </div>
          <div class="controls">
            <button id="btn-start" class="pip-btn">INITIALIZE</button>
            <button id="btn-pause" class="pip-btn">HALT</button>
            <button id="btn-reset" class="pip-btn">RESET</button>
            <button
              id="btn-test"
              class="pip-btn"
              style="border-color: var(--pip-amber); color: var(--pip-amber)"
            >
              TEST
            </button>
          </div>
        </div>

        <div class="character-display">
          <!-- Placeholder for Vault Boy -->
          <img
            id="vault-boy"
            src="assets/images/vault_boy.png"
            alt="Vault Boy"
            class="vault-boy-img"
          />
          <img
            id="explosion"
            src="assets/images/explosion.png"
            alt="Nuclear Explosion"
            class="explosion-img hidden"
          />
        </div>
      </main>

      <footer class="pip-footer">
        <div class="function-description" id="function-description">
          Pomodoro technique: 25 minute work sessions with breaks.
        </div>
      </footer>
    </div>

    <script src="js/script.js"></script>
  </body>
</html>
