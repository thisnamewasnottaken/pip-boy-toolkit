<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pip-Boy Toolkit - Settings</title>
    <!-- Core Styles -->
    <link rel="stylesheet" href="../../core/css/main.css" />
    <!-- Tool Styles -->
    <link rel="stylesheet" href="css/style.css" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet" />
</head>

<body>
    <!-- Shared CRT Effects -->
    <div class="crt-overlay"></div>
    <div class="screen-curve"></div>

    <div class="pip-boy-container">
        <header class="pip-header">
            <span class="status-item"><a href="../../index.html">MENU</a></span>
            <span class="status-item"><a href="../pomodoro/index.html">TIMER</a></span>
            <span class="status-item active">SETTINGS</span>
            <span class="status-item">MAP</span>
            <span class="status-item">RADIO</span>
        </header>

        <main class="pip-content" style="flex-direction: column; justify-content: center;">
            <div class="settings-container">

                <div class="setting-group">
                    <label for="username-input">USER IDENTIFICATION</label>
                    <div class="setting-description">ENTER TERMINAL USERNAME (MAX 25 CHARS).</div>
                    <input type="text" id="username-input" class="pip-input" placeholder="VAULTDWELLER" maxlength="25">
                </div>

                <div class="setting-group"
                    style="flex-direction: row; justify-content: space-between; align-items: center;">
                    <div>
                        <label for="test-mode-input">DEBUG / TEST MODE</label>
                        <div class="setting-description">ENABLE EXPERIMENTAL FEATURES.</div>
                    </div>
                    <label class="toggle-switch">
                        <input type="checkbox" id="test-mode-input">
                        <span class="slider"></span>
                    </label>
                </div>

                <div class="status-message" id="status-message"></div>

                <div class="settings-actions">
                    <div class="controls">
                        <button id="btn-reset">RESET DEFAULTS</button>
                        <button id="btn-save">SAVE CONFIG</button>
                    </div>
                </div>
            </div>
        </main>

        <footer class="pip-footer">
            <div class="function-description">
                CONFIGURE SYSTEM PARAMETERS AND PREFERENCES.
            </div>
        </footer>
    </div>

    <!-- Core Logic -->
    <script src="../../core/js/main.js"></script>
    <!-- Tool Logic -->
    <script src="js/script.js"></script>
</body>

</html>
