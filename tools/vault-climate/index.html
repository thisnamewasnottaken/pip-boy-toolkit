<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pip-Boy Toolkit - Vault Climate</title>
    <!-- Core Styles -->
    <link rel="stylesheet" href="../../core/css/main.css" />
    <!-- Tool Styles -->
    <link rel="stylesheet" href="css/style.css" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet" />
</head>

<body>
    <!-- Shared CRT Effects -->
    <div class="crt-overlay"></div>
    <div class="screen-curve"></div>

    <div class="pip-boy-container">
        <header class="pip-header">
            <span class="status-item"><a href="../../index.html">MENU</a></span>
            <span class="status-item active">CLIMATE</span>
            <span class="status-item"><a href="../settings/index.html">SETTINGS</a></span>
        </header>

        <main class="pip-content">
            <div class="climate-display">
                <div class="location-info">
                    LOC: <span id="location-name">SCANNING...</span>
                    <div class="coords" id="coordinates">[-00.0000, +00.0000]</div>
                </div>

                <div class="weather-main">
                    <div class="condition-box">
                        <div class="label">CONDITION</div>
                        <div class="value" id="weather-condition">RECALIBRATING...</div>
                    </div>

                    <div class="temp-box">
                        <div id="temperature">--</div>
                        <div class="unit" id="temp-unit">&deg;C</div>
                    </div>
                </div>

                <div class="stats-grid">
                    <div class="stat-item">
                        <div class="label">HUMIDITY</div>
                        <div class="value-row">
                            <div class="pip-gauge">
                                <div class="gauge-fill" id="humidity-gauge" style="width: 0%"></div>
                            </div>
                            <span id="humidity" class="gauge-text">--%</span>
                        </div>
                    </div>
                    <div class="stat-item highlight">
                        <div class="label">RAD-LEVEL</div>
                        <div class="value-row">
                            <div class="pip-gauge">
                                <div class="gauge-fill" id="radiation-gauge" style="width: 0%"></div>
                            </div>
                            <span id="radiation-level" class="gauge-text">ZERO</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Character Display Removed as per user request -->

        </main>

        <footer class="pip-footer">
            <div class="function-description" id="function-description">
                EXTERNAL ENVIRONMENT MONITORING SYSTEM. DATA RETRIEVED VIA OPEN-METEO.
            </div>
        </footer>
    </div>

    <!-- Core Logic -->
    <script src="../../core/js/main.js"></script>
    <!-- Tool Logic -->
    <script src="js/script.js"></script>
</body>

</html>
