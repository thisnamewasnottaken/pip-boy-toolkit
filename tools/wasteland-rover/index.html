<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pip-Boy Toolkit - Wasteland Rover</title>
    <!-- Core Styles -->
    <link rel="stylesheet" href="../../core/css/main.css" />
    <!-- Tool Styles -->
    <link rel="stylesheet" href="css/style.css" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet" />
</head>

<body>
    <!-- Shared CRT Effects -->
    <div class="crt-overlay"></div>
    <div class="screen-curve"></div>

    <div class="pip-boy-container">
        <header class="pip-header">
            <span class="status-item"><a href="../../index.html">MENU</a></span>
            <span class="status-item active">ROVER</span>
            <span class="status-item"><a href="../settings/index.html">SETTINGS</a></span>
        </header>

        <main class="pip-content">
            <div class="game-area">
                <div class="game-header">
                    <div class="stat-box">
                        <span class="label">DISTANCE:</span>
                        <span id="distance" class="value">00000m</span>
                    </div>
                    <div class="stat-box">
                        <span class="label">HIGH SCORE:</span>
                        <span id="high-score" class="value">00000m</span>
                    </div>
                </div>

                <div id="canvas-container">
                    <canvas id="game-canvas"></canvas>
                    <img id="nuke-explosion" src="../../assets/images/explosion.png" alt="NUKE" class="hidden">
                    <div id="game-overlay" class="hidden">
                        <div class="overlay-content">
                            <h2 id="overlay-title">SYSTEM OFFLINE</h2>
                            <p id="overlay-message">PRESS SPACE TO INITIALIZE ROVER</p>
                            <button id="restart-btn" class="pip-btn">REBOOT</button>
                        </div>
                    </div>
                </div>

                <div class="game-controls">
                    <p>CONTROLS: SPACE / TAP TO JUMP</p>
                </div>
            </div>
        </main>

        <footer class="pip-footer">
            <div class="function-description" id="function-description">
                WASTELAND ROVER: NAVIGATE THE WASTES. AVOID RAD-ROACHES AND DEBRIS.
            </div>
        </footer>
    </div>

    <!-- Core Logic -->
    <script src="../../core/js/main.js"></script>
    <!-- Tool Logic -->
    <script src="js/script.js"></script>
</body>

</html>
